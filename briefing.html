<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>בד״ח טייסת 113</title>
<meta name="theme-color" content="#100f0d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png">
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html, body{ height:100%; background:#100f0d; overflow:hidden; overscroll-behavior:none; touch-action:manipulation; }
  body{ font-family:'Segoe UI', Arial, sans-serif; }

  #viewer{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:#100f0d;
  }
  #pageWrap{ position:relative; z-index:6; display:none; }
  #pdfCanvasImg{
    display:block;
    width:100%;
    height:100%;
    object-fit:fill;
    box-shadow:0 20px 60px rgba(0,0,0,.6);
  }
  #hotLayer{ position:absolute; inset:0; }
  #hotLayer .hot{
    position:absolute;
    cursor:pointer;
    touch-action:manipulation;
    /* לבדיקה: אפשר לבטל את ההערה בשורה הבאה כדי לראות את אזורי הלחיצה */
    /* background: rgba(0,255,0,0.18); outline:1px solid lime; */
  }

  .hud{
    position:fixed; top:0; left:0; right:0;
    display:flex; align-items:center; justify-content:space-between;
    padding:calc(env(safe-area-inset-top, 0px) + 14px) 16px 0 16px;
    z-index:10; pointer-events:none;
  }
  .hud > *{ pointer-events:auto; }
  .hud-btn{
    display:inline-flex; align-items:center; gap:7px;
    background:rgba(16,15,13,0.78);
    border:1px solid rgba(207,165,58,0.3);
    color:#ece8db; font-size:15px; font-weight:700;
    padding:13px 20px; border-radius:999px; backdrop-filter:blur(6px);
    text-decoration:none;
    min-height:44px;
  }
  .page-count{
    background:rgba(16,15,13,0.65);
    border:1px solid rgba(207,165,58,0.28);
    color:#cfa53a; font-family:'Courier New',monospace; font-size:12.5px; font-weight:700;
    padding:10px 14px; border-radius:999px; backdrop-filter:blur(6px);
  }

  .loading, .error-box{
    position:fixed; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; color:#8c8672; font-size:14px; text-align:center; padding:30px; z-index:20;
    background:#100f0d;
  }
  .error-box{ color:#ece8db; }
</style>
</head>
<body>

<div class="hud">
  <a class="hud-btn" href="index.html">→ יציאה לדף הבית</a>
  <span class="page-count" id="pageCount">—</span>
</div>

<div id="viewer">
  <div class="loading" id="loadingMsg">טוענת את הבד״ח…</div>
  <div id="pageWrap">
    <img id="pdfCanvasImg" alt="שקף">
    <div id="hotLayer"></div>
  </div>
</div>

<script>
/* ============================================================
   קבצים נדרשים בשורש האתר:
   slide-001.jpg עד slide-NNN.jpg
   slides-manifest.json (מיקומי קישורים + מידות העמוד המקוריות)
   ============================================================ */

let manifest = null;
let pageNum = 0;
let currentToken = 0; // מונע מצב מרוץ אם עוברים שקף לפני שהקודם סיים להיטען

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

const viewer = document.getElementById('viewer');
const img = document.getElementById('pdfCanvasImg');
const pageWrap = document.getElementById('pageWrap');
const hotLayer = document.getElementById('hotLayer');
const loadingMsg = document.getElementById('loadingMsg');
const pageCountEl = document.getElementById('pageCount');

function slideUrl(i){
  return 'slide-' + String(i+1).padStart(3,'0') + '.jpg';
}

// --- מיקום הקישורים: תלוי רק במידות הקבועות של העמוד (מה-manifest),
//     לא בטעינת התמונה בפועל - כך שהם פעילים מיידית ---
function layout(){
  const vv = window.visualViewport;
  const cw = vv ? vv.width : viewer.clientWidth;
  const ch = vv ? vv.height : viewer.clientHeight;
  const pr = manifest.pageWidth / manifest.pageHeight;
  const cr = cw / ch;
  let dispW, dispH;
  if(pr > cr){ dispW = cw; dispH = cw / pr; } else { dispH = ch; dispW = ch * pr; }
  return { dispW, dispH };
}

function positionHotspots(){
  if(!manifest) return;
  const { dispW, dispH } = layout();
  pageWrap.style.width = dispW + 'px';
  pageWrap.style.height = dispH + 'px';

  hotLayer.innerHTML = '';
  const links = manifest.pages[pageNum].links;
  links.forEach(l => {
    const div = document.createElement('div');
    div.className = 'hot';
    div.style.left = (l.x*dispW) + 'px';
    div.style.top = (l.y*dispH) + 'px';
    div.style.width = (l.w*dispW) + 'px';
    div.style.height = (l.h*dispH) + 'px';

    // מגע מהיר: pointerup מגיב מיידית, בלי עיכוב ה-300ms הקלאסי של תגי click בדפדפני מובייל
    let downX=0, downY=0, moved=false;
    div.addEventListener('pointerdown', e => { downX=e.clientX; downY=e.clientY; moved=false; });
    div.addEventListener('pointermove', e => {
      if(Math.abs(e.clientX-downX) > 10 || Math.abs(e.clientY-downY) > 10) moved = true;
    });
    div.addEventListener('pointerup', e => {
      if(!moved) goToPage(l.page, true);
    });

    hotLayer.appendChild(div);
  });
}

function preloadLimited(){
  const links = manifest.pages[pageNum].links;
  const targets = [...new Set(links.map(l => l.page))].slice(0, 6);
  targets.forEach(p => { const im = new Image(); im.src = slideUrl(p); });
}

function showPage(i){
  const token = ++currentToken;
  pageCountEl.textContent = (i+1) + ' / ' + manifest.pageCount;

  // 1) מציגים את מסגרת השקף ומפעילים קישורים מיידית
  pageWrap.style.display = 'block';
  loadingMsg.style.display = 'none';
  positionHotspots();

  // 2) טוענים את התמונה עצמה ברקע ומחליפים כשמוכן (עם ניסיון חוזר אוטומטי)
  loadImage(i, 0, token);
  preloadLimited();
}

function loadImage(i, attempt, token){
  const target = new Image();
  target.onload = () => {
    if(token !== currentToken) return; // המשתמש כבר עבר לשקף אחר בינתיים
    img.src = target.src;
  };
  target.onerror = () => {
    if(token !== currentToken) return;
    if(attempt < 3){ setTimeout(() => loadImage(i, attempt+1, token), 500); }
  };
  target.src = slideUrl(i) + (attempt ? ('?r='+attempt) : '');
}

function goToPage(i, pushHistory){
  if(!manifest || i == null || i < 0 || i >= manifest.pageCount) return;
  pageNum = i;
  if(pushHistory){ history.pushState({ page: i }, '', '#s' + (i+1)); }
  showPage(i);
}

window.addEventListener('popstate', e => {
  const i = (e.state && typeof e.state.page === 'number') ? e.state.page : 0;
  pageNum = i;
  showPage(i);
});

window.addEventListener('resize', positionHotspots);
window.addEventListener('orientationchange', () => setTimeout(positionHotspots, 300));
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', positionHotspots);
  window.visualViewport.addEventListener('scroll', positionHotspots);
}

function loadManifest(attempt){
  fetch('slides-manifest.json', { cache: 'no-store' }).then(r => {
    if(!r.ok) throw new Error('bad status');
    return r.json();
  }).then(data => {
    manifest = data;
    const startHash = parseInt((location.hash || '').replace('#s',''), 10);
    const start = (!isNaN(startHash) && startHash >= 1 && startHash <= manifest.pageCount) ? startHash-1 : 0;
    history.replaceState({ page: start }, '', location.pathname);
    goToPage(start, false);
  }).catch(() => {
    if(attempt < 4){
      setTimeout(() => loadManifest(attempt+1), 700);
    } else {
      document.getElementById('viewer').innerHTML = `
        <div class="error-box">
          <div>לא הצלחתי לטעון את הבד״ח כאן.<br>ודאי שקבצי slide-XXX.jpg וקובץ slides-manifest.json קיימים בשורש האתר.</div>
          <a class="hud-btn" href="javascript:location.reload()">ניסיון נוסף</a>
        </div>`;
    }
  });
}
loadManifest(0);
</script>
</body>
</html>
