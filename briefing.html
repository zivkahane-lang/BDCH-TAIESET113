<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>בד״ח טייסת 113</title>
<meta name="theme-color" content="#100f0d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png">
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html, body{ height:100%; background:#100f0d; overflow:hidden; overscroll-behavior:none; }
  body{ font-family:'Segoe UI', Arial, sans-serif; }

  #viewer{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:#100f0d;
  }
  #slideImg{
    max-width:100%; max-height:100%;
    display:block;
    user-select:none;
    -webkit-user-drag:none;
  }
  #hotLayer{ position:fixed; inset:0; z-index:6; pointer-events:none; }
  #hotLayer .hot{
    position:absolute;
    pointer-events:auto;
    cursor:pointer;
    /* להסרת ההערה למטה ניתן לראות את אזורי הלחיצה בזמן בדיקה */
    /* background: rgba(0,255,0,0.15); border:1px solid lime; */
  }

  .hud{
    position:fixed; top:0; left:0; right:0;
    display:flex; align-items:center; justify-content:space-between;
    padding:calc(env(safe-area-inset-top, 0px) + 14px) 16px 0 16px;
    z-index:10; pointer-events:none;
  }
  .hud > *{ pointer-events:auto; }
  .hud-btn{
    display:inline-flex; align-items:center; gap:7px;
    background:rgba(16,15,13,0.78);
    border:1px solid rgba(207,165,58,0.3);
    color:#ece8db; font-size:15px; font-weight:700;
    padding:13px 20px; border-radius:999px; backdrop-filter:blur(6px);
    text-decoration:none;
    min-height:44px;
  }
  .page-count{
    background:rgba(16,15,13,0.65);
    border:1px solid rgba(207,165,58,0.28);
    color:#cfa53a; font-family:'Courier New',monospace; font-size:12.5px; font-weight:700;
    padding:10px 14px; border-radius:999px; backdrop-filter:blur(6px);
  }

  .loading, .error-box{
    position:fixed; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; color:#8c8672; font-size:14px; text-align:center; padding:30px; z-index:20;
    background:#100f0d;
  }
  .error-box{ color:#ece8db; }
</style>
</head>
<body>

<div class="hud">
  <a class="hud-btn" href="index.html">→ יציאה לדף הבית</a>
  <span class="page-count" id="pageCount">—</span>
</div>

<div id="viewer">
  <div class="loading" id="loadingMsg">טוענת את הבד״ח…</div>
  <img id="slideImg" style="display:none;" alt="שקף">
</div>
<div id="hotLayer"></div>

<script>
/* ============================================================
   קבצי הצג נוצרים אוטומטית מתוך ה-PDF:
   assets/slides/slide-001.jpg עד assets/slides/slide-NNN.jpg
   assets/slides-manifest.json - מיקום מדויק של כל קישור בכל עמוד
   ============================================================ */

let manifest = null;
let pageNum = 0; // אינדקס מבוסס-0
let imgLoading = false;

const viewer = document.getElementById('viewer');
const img = document.getElementById('slideImg');
const hotLayer = document.getElementById('hotLayer');
const loadingMsg = document.getElementById('loadingMsg');
const pageCountEl = document.getElementById('pageCount');

function slideUrl(i){
  return 'slide-' + String(i+1).padStart(3,'0') + '.jpg';
}

function positionHotspots(){
  if(!manifest) return;
  const vv = window.visualViewport;
  const cw = vv ? vv.width : viewer.clientWidth;
  const ch = vv ? vv.height : viewer.clientHeight;
  const iw = img.naturalWidth, ih = img.naturalHeight;
  if(!iw || !ih) return;

  const imgRatio = iw/ih, containerRatio = cw/ch;
  let dispW, dispH, offX, offY;
  if(imgRatio > containerRatio){
    dispW = cw; dispH = cw/imgRatio; offX = 0; offY = (ch-dispH)/2;
  } else {
    dispH = ch; dispW = ch*imgRatio; offY = 0; offX = (cw-dispW)/2;
  }

  hotLayer.innerHTML = '';
  const links = manifest.pages[pageNum].links;
  links.forEach(l => {
    const div = document.createElement('div');
    div.className = 'hot';
    div.style.left = (offX + l.x*dispW) + 'px';
    div.style.top = (offY + l.y*dispH) + 'px';
    div.style.width = (l.w*dispW) + 'px';
    div.style.height = (l.h*dispH) + 'px';
    div.addEventListener('click', () => goToPage(l.page, true));
    hotLayer.appendChild(div);
  });
}

function preloadNeighbors(){
  const links = manifest.pages[pageNum].links;
  links.forEach(l => { const im = new Image(); im.src = slideUrl(l.page); });
}

function showPage(i, attempt){
  attempt = attempt || 0;
  imgLoading = true;
  const target = new Image();
  target.onload = () => {
    img.src = target.src;
    img.style.display = 'block';
    loadingMsg.style.display = 'none';
    // מחכים לשני פריימים כדי שהדפדפן יסיים ליישב את הפריסה (בעיקר בטלפון)
    // לפני שמודדים מיקומים - זה מונע חוסר-דיוק שמתגלה רק אחרי זום
    requestAnimationFrame(() => requestAnimationFrame(() => {
      positionHotspots();
      preloadNeighbors();
      imgLoading = false;
    }));
  };
  target.onerror = () => {
    if(attempt < 3){
      setTimeout(() => showPage(i, attempt+1), 500);
    } else {
      imgLoading = false;
      loadingMsg.style.display = 'flex';
      loadingMsg.textContent = 'שגיאה בטעינת השקף.';
    }
  };
  target.src = slideUrl(i) + (attempt ? ('?r=' + attempt) : '');
  pageCountEl.textContent = (i+1) + ' / ' + manifest.pageCount;
}

function goToPage(i, pushHistory){
  if(!manifest || i == null || i < 0 || i >= manifest.pageCount) return;
  pageNum = i;
  if(pushHistory){ history.pushState({ page: i }, '', '#s' + (i+1)); }
  showPage(i);
}

window.addEventListener('popstate', e => {
  const i = (e.state && typeof e.state.page === 'number') ? e.state.page : 0;
  pageNum = i;
  showPage(i);
});

window.addEventListener('resize', positionHotspots);
window.addEventListener('orientationchange', () => setTimeout(positionHotspots, 300));
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', positionHotspots);
  window.visualViewport.addEventListener('scroll', positionHotspots);
}

function loadManifest(attempt){
  fetch('slides-manifest.json', { cache: 'no-store' }).then(r => {
    if(!r.ok) throw new Error('bad status');
    return r.json();
  }).then(data => {
    manifest = data;
    const startHash = parseInt((location.hash || '').replace('#s',''), 10);
    const start = (!isNaN(startHash) && startHash >= 1 && startHash <= manifest.pageCount) ? startHash-1 : 0;
    history.replaceState({ page: start }, '', location.pathname);
    goToPage(start, false);
  }).catch(() => {
    if(attempt < 4){
      setTimeout(() => loadManifest(attempt+1), 700);
    } else {
      document.getElementById('viewer').innerHTML = `
        <div class="error-box">
          <div>לא הצלחתי לטעון את הבד״ח כאן.<br>ודאי שקבצי slide-XXX.jpg וקובץ slides-manifest.json קיימים בשורש האתר.</div>
          <a class="hud-btn" href="javascript:location.reload()">ניסיון נוסף</a>
        </div>`;
    }
  });
}
loadManifest(0);
</script>
</body>
</html>
