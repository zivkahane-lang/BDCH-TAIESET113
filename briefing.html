<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>הבד״ח | הטייסת</title>
<meta name="theme-color" content="#100f0d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html, body{ height:100%; background:#100f0d; overflow:hidden; }
  body{ font-family:'Segoe UI', Arial, sans-serif; }

  #pdfFrame{
    position:fixed; inset:0;
    width:100%; height:100%;
    border:0; display:block;
    background:#100f0d;
  }

  .hud{
    position:fixed; top:0; right:0; z-index:10;
    padding:14px 16px;
  }
  .hud-btn{
    display:inline-flex; align-items:center; gap:6px;
    background:rgba(16,15,13,0.75);
    border:1px solid rgba(207,165,58,0.3);
    color:#ece8db; font-size:13px; font-weight:600;
    padding:9px 16px; border-radius:999px; backdrop-filter:blur(6px);
    text-decoration:none;
  }

  .fallback{
    position:fixed; inset:0; display:none;
    flex-direction:column; align-items:center; justify-content:center;
    gap:16px; color:#ece8db; text-align:center; padding:30px; z-index:1;
  }
</style>
</head>
<body>

<div class="hud"><a class="hud-btn" href="index.html">→ חזרה</a></div>

<!--
  ============================================================
  הצג את המצגת:
  יש לשמור את קובץ ה-PPTX כ-PDF ולהעלות אותו לתיקיית assets
  בשם המדויק: bdch.pdf

  #toolbar=0&navpanes=0&view=FitH הן הוראות פתיחה שהדפדפן
  (בעיקר Chrome/Edge) מכבד: מסתיר סרגלי כלים ומתאים לרוחב המסך.
  לא כל הדפדפנים תומכים בפרמטרים האלו (בעיקר בטלפון), אבל זה
  לא פוגע בתפקוד - רק לא תמיד מסתיר את הסרגל.
  ============================================================
-->
<iframe id="pdfFrame"
  src="assets/bdch.pdf#toolbar=0&navpanes=0&view=FitH"
  title="מצגת הבד״ח">
</iframe>

<div class="fallback" id="fallback">
  <div>לא הצלחתי לטעון את המצגת כאן.<br>ודאי שקובץ bdch.pdf קיים בתיקיית assets.</div>
  <a class="hud-btn" href="assets/bdch.pdf" target="_blank" rel="noopener">פתיחת הקובץ ישירות ↗</a>
</div>

</body>
</html>
